[package]
name = "ludo-server"
version = "0.1.0"
edition = "2021"
description = "LAN relay + static server for Offline Multiplayer Ludo"
license = "MIT"

[lib]
name = "ludo_server"
path = "src/lib.rs"

[[bin]]
name = "ludo-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
local-ip-address = "0.6.13"
mime_guess = "2.0.5"
rand = "0.10.3"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"
