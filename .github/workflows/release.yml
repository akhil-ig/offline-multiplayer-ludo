name: Release (Android APK + Linux desktop)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264
      - name: Export NDK path
        run: echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri CLI (local, so Gradle records an absolute CLI path)
        run: npm ci
        working-directory: tauri
      - name: Generate icons
        run: npx tauri icon icons/icon.png
        working-directory: tauri
      - name: Init Android project
        run: npx tauri android init --ci
        working-directory: tauri
      - name: Patch manifest (loopback cleartext, permissions, portrait)
        run: ./android/patch.sh
        working-directory: tauri
      - name: Build APK (debug-signed, installs anywhere)
        run: npx tauri android build --apk --debug --target aarch64 --target armv7
        working-directory: tauri
      - name: Build APK (release, unsigned)
        run: npx tauri android build --apk --target aarch64 --target armv7
        working-directory: tauri
      - name: Collect APKs
        run: |
          mkdir -p out
          find tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: out/*.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*.apk
          generate_release_notes: true

  linux:
    name: Linux desktop (AppImage + deb)
    runs-on: ubuntu-22.04
    needs: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: System deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: tauri
      - run: npx tauri icon icons/icon.png
        working-directory: tauri
      - run: npx tauri build
        working-directory: tauri
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: |
            tauri/target/release/bundle/appimage/*.AppImage
            tauri/target/release/bundle/deb/*.deb
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            tauri/target/release/bundle/appimage/*.AppImage
            tauri/target/release/bundle/deb/*.deb
