name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 7

  server:
    name: Rust server tests
    runs-on: ubuntu-latest
    needs: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
        working-directory: server
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: server
      - run: cargo test
        working-directory: server
      - run: cargo build --release
        working-directory: server
      - uses: actions/upload-artifact@v4
        with:
          name: ludo-server-linux-x86_64
          path: server/target/release/ludo-server
          retention-days: 7

  browser:
    name: Browser checks (pass & play, animation, sound, bots, LAN)
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: actions/download-artifact@v4
        with:
          name: ludo-server-linux-x86_64
          path: server/target/debug
      - run: chmod +x server/target/debug/ludo-server
      - run: npm ci
        working-directory: ui
      - run: npm i -D playwright@1 && npx playwright install --with-deps chromium
        working-directory: ui
      - name: Start preview server
        run: (npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &) && sleep 2
        working-directory: ui
      - run: npm run e2e
        working-directory: ui
      - run: npm run anim-check
        working-directory: ui
      - run: npm run sound-check
        working-directory: ui
      - run: npm run bot-soak
        working-directory: ui
      - run: npm run lan-check
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots
          retention-days: 7
